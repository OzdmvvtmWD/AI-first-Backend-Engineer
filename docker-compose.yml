services:

  backend:
    build: ./backend
    working_dir: /app/backend_engineer
    restart: always

    volumes:
      - ./backend:/app
      - static_volume:/app/backend_engineer/staticfiles
    expose:
      - 8000

    command: /entrypoint.sh
    
    env_file:
      - .env
    
    depends_on:
      - db
  
  db:
    image: postgres:17.5-alpine3.21
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - postgres_db:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT}:5432"

  pgAdmin:
    image: dpage/pgadmin4:9.5.0
    restart: always
    ports:
      - ${PGADMIN_PORT}:81

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  
    depends_on:
      - db

    volumes:
      - pgadmin-data:/var/lib/pgadmin

  nginx:
    build: ./nginx
    ports:
    - 1337:80
    depends_on:
      - backend

    volumes:
      - static_volume:/app/backend_engineer/staticfiles

  celery:
    build: ./backend
    working_dir: /app/backend_engineer
    command: celery -A backend_engineer.celery:app worker --loglevel=info

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      - redis
      - db

  redis:
    image: redis:8.10-alpine

  flower:
    image: mher/flower
    container_name: flower
    command: celery flower --persisten=True
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=8888
      - FLOWER_BASIC_AUTH=username:password
    ports:
    - 8888:8888 
    volumes:
    - flower_data:/data

volumes:
  postgres_db:
  pgadmin-data:
  static_volume:
  flower_data:
